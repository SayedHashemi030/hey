<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیام عاشقانه</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .heart {
            position: absolute;
            color: red; /* رنگ قلب قرمز */
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-50px);
            }
            100% {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <script>
        function createLoveMessage() {
            const message = 'دوستت دارم ♥';
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.textContent = message;

            // موقعیت تصادفی برای قلب
            const xPos = Math.random() * window.innerWidth;
            const yPos = Math.random() * window.innerHeight;

            // تنظیم موقعیت تصادفی
            heart.style.left = xPos + 'px'; // بدون ${}
            heart.style.top = yPos + 'px';  // بدون ${}

            // اندازه تصادفی برای قلب
            const size = Math.random() * 30 + 20; // اندازه بین 20 تا 50
            heart.style.fontSize = size + 'px'; // بدون ${}

            document.body.appendChild(heart);

            // حذف قلب بعد از 3 ثانیه
            setTimeout(() => {
                heart.remove();
            }, 3000); // بعد از 3 ثانیه قلب حذف می‌شود
        }

        // ایجاد پیام‌ها هر 0.2 ثانیه
        setInterval(createLoveMessage, 200);
    </script>
</body>
</html>
